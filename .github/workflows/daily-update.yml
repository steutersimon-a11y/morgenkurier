name: Morgenkurier taeglich aktualisieren

on:
  schedule:
    # 04:30 UTC = 06:30 Uhr im Sommer (CEST) / 05:30 Uhr im Winter (CET).
    # Der Lauf besteht aus drei Phasen: Feeds holen (Sekunden), Redaktion
    # durch Claude inkl. Web-Recherche (ca. 3-6 Minuten) und Rendern
    # (Sekunden). Der Puffer bis 8 Uhr ist damit komfortabel.
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Phase 1: Rohmaterial aus zwoelf oeffentlichen RSS-Feeds.
      # Schreibt build/material.md und build/sources.json.
      - name: Rohmaterial sammeln
        run: python scripts/fetch_material.py

      # Phase 2: Redaktion. Claude liest das Material, recherchiert per
      # Websuche nach und schreibt den redaktionellen Inhalt als reines JSON
      # nach build/content.json. Es entsteht bewusst KEIN HTML - das Layout
      # bleibt allein Sache des Render-Skripts.
      - name: Ausgabe redigieren (Claude)
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 25
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Lies scripts/editorial_brief.md und folge dem Briefing
            vollstaendig. Ergebnis ist genau eine Datei: build/content.json.
          # Sonnet 5 statt Opus 5: bei einem Spend-Limit von 25 $/Monat waere
          # Opus mit Web-Recherche (geschaetzt ~24 $) zu knapp - ein einziger
          # teurer Tag wuerde die Zeitung fuer den Rest des Monats stoppen.
          # Sonnet liegt bei ~16 $ und laesst Puffer fuer Fehlversuche.
          # --max-turns begrenzt die Agentenschleife und damit die Kosten
          # eines einzelnen entgleisten Laufs.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python3:*)"

      # Phase 3: Deterministisches Rendern. Bricht ab, wenn content.json
      # fehlt oder unvollstaendig ist - eine halb leere Zeitung wird nicht
      # deployt.
      - name: HTML rendern
        run: python scripts/render_issue.py

      - name: Aenderung committen und pushen
        run: |
          git config user.name "morgenkurier-bot"
          git config user.email "morgenkurier-bot@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "Keine Aenderungen an index.html."
          else
            git add index.html
            git commit -m "Automatisches Update: neue Ausgabe vom $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
