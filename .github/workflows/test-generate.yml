name: Testlauf (ohne Deploy)

# Validiert die Pipeline auf einem Feature-Branch, ohne zu veroeffentlichen.
#
# Der Hauptworkflow deklariert 'environment: github-pages'. Diese Environment
# ist per Branch-Schutzregel auf den Default-Branch beschraenkt, weshalb der
# Job auf jedem anderen Branch nach ~2 Sekunden abgelehnt wird, bevor auch
# nur ein Schritt laeuft. Dieser Workflow laesst die Environment und die
# Pages-Schritte weg und kann dadurch ueberall laufen.
#
# Er committet und deployt bewusst nichts. Ergebnis sind zwei Artefakte zum
# Herunterladen: das redaktionelle JSON und die daraus gerenderte Seite.
#
# Nach erfolgreichem Test kann diese Datei geloescht werden.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  # Die Action tauscht immer ein OIDC-Token gegen ein GitHub-App-Token,
  # unabhaengig davon, wie Claude selbst authentifiziert ist. Ohne diese
  # Berechtigung bricht sie nach drei Versuchen ab.
  id-token: write

jobs:
  testlauf:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rohmaterial sammeln
        run: python scripts/fetch_material.py

      - name: Ausgabe redigieren (Claude)
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 25
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Diagnose: druckt die vollstaendige Fehlermeldung des Modellaufrufs.
          # Nach dem ersten erfolgreichen Lauf kann das raus.
          show_full_output: true
          prompt: |
            Lies scripts/editorial_brief.md und folge dem Briefing
            vollstaendig. Ergebnis ist genau eine Datei: build/content.json.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python3:*)"

      - name: HTML rendern
        run: python scripts/render_issue.py

      - name: Ergebnis als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morgenkurier-testlauf
          path: |
            build/content.json
            build/material.md
            index.html
          if-no-files-found: warn
          retention-days: 7
